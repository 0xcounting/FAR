name: Confirm or reject a DTI link
description: Turn a proposed DTI ↔ CoinGecko link into an accepted or rejected one.
labels: [link]
body:
  - type: markdown
    attributes:
      value: |
        1,929 links are currently `proposed` (matched on name) and **zero** are
        `accepted`. Confirming one is the highest-value contribution to this repo.

        Names and symbols are not evidence — that is what the automatic rule
        already used. See CONTRIBUTING.md for what counts.
  - type: input
    id: dti
    attributes: { label: DTI, placeholder: 2RJ2NRNJ5 }
    validations: { required: true }
  - type: input
    id: coingecko
    attributes: { label: CoinGecko ID, placeholder: tether }
    validations: { required: true }
  - type: dropdown
    id: verdict
    attributes:
      label: Verdict
      options: ['accept — these are the same asset', 'reject — these are different assets']
    validations: { required: true }
  - type: textarea
    id: rationale
    attributes:
      label: What did you check?
      description: This becomes the `rationale` field and is published. Say what you verified, not how confident you are.
      placeholder: Tether's documentation gives 0xdac17f… as USDT on Ethereum and Etherscan shows it verified as Tether USD / USDT / 6 decimals, which is the address in CoinGecko's `ethereum` platform entry for coin id `tether`.
    validations: { required: true }
