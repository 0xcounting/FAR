name: refresh-sources
on:
  schedule:
    # DTIF refreshes its free snapshot monthly. Run on the 5th so the new month's
    # file is definitely up, at a quiet hour.
    - cron: '0 4 5 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: fetch upstream snapshots
        id: fetch
        run: |
          set -euo pipefail
          mkdir -p /tmp/fresh

          # CoinGecko: public endpoint, no key. If it rate-limits, the step fails
          # and the PR simply is not opened — stale data is better than partial.
          curl -sSf --retry 3 --retry-delay 20 \
            'https://api.coingecko.com/api/v3/coins/list?include_platform=false' \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
                const a=JSON.parse(s).map(c=>({id:c.id,symbol:c.symbol,name:c.name}));
                a.sort((x,y)=>x.id<y.id?-1:1);
                process.stdout.write(JSON.stringify(a));})' \
            | gzip -9 -n > /tmp/fresh/coingecko-coins.json.gz

          curl -sSf --retry 3 --retry-delay 20 \
            'https://api.coingecko.com/api/v3/coins/list?include_platform=true' \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
                const rows=[];
                for (const c of JSON.parse(s)) for (const [platform,identity] of Object.entries(c.platforms??{}))
                  if (platform && identity) rows.push({platform,identity,coinId:c.id});
                rows.sort((a,b)=>(a.platform+a.identity+a.coinId)<(b.platform+b.identity+b.coinId)?-1:1);
                process.stdout.write(JSON.stringify(rows));})' \
            | gzip -9 -n > /tmp/fresh/coingecko-platforms.json.gz

          curl -sSf --retry 3 'https://chainid.network/chains_mini.json' \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
                const a=JSON.parse(s).map(c=>({chainId:c.chainId,name:c.name,shortName:c.shortName,nativeCurrency:c.nativeCurrency}));
                a.sort((x,y)=>x.chainId-y.chainId);
                process.stdout.write(JSON.stringify(a));})' \
            | gzip -9 -n > /tmp/fresh/evm-chains.json.gz

          curl -sSf --retry 3 'https://raw.githubusercontent.com/satoshilabs/slips/master/slip-0044.md' -o /tmp/slip44.md
          node -e '
            const fs=require("fs");const rows=[];
            for (const line of fs.readFileSync("/tmp/slip44.md","utf8").split("\n")) {
              const m=line.match(/^\|\s*(\d+)\s*\|([^|]*)\|([^|]*)\|/); if(!m) continue;
              const clean=(s)=>s.replace(/\[([^\]]+)\]\([^)]*\)/g,"$1").trim();
              const symbol=clean(m[2]); if(!symbol) continue;
              rows.push({coinType:Number(m[1]),symbol,name:clean(m[3])});
            }
            if (rows.length < 1000) { console.error("slip44 parse produced "+rows.length+" rows; refusing"); process.exit(1); }
            fs.writeFileSync("/tmp/fresh/slip44.json", JSON.stringify(rows));'
          gzip -9 -n -c /tmp/fresh/slip44.json > /tmp/fresh/slip44.json.gz && rm /tmp/fresh/slip44.json

          # DTIF publishes behind a redirect; follow it and sanity-check the shape
          # before letting it replace a known-good snapshot.
          curl -sSfL --retry 3 'https://dtif.org/download-redirect/' -o /tmp/dti.json || {
            echo "::warning::DTIF download failed — keeping the existing snapshot"; }
          if [ -s /tmp/dti.json ] && node -e '
              const d=JSON.parse(require("fs").readFileSync("/tmp/dti.json","utf8"));
              if (!Array.isArray(d.records) || d.records.length < 4000) {
                console.error("DTI snapshot has "+(d.records?.length ?? 0)+" records; refusing"); process.exit(1); }'; then
            gzip -9 -n -c /tmp/dti.json > /tmp/fresh/dti-registry.json.gz
          fi

      - name: replace snapshots and rebuild
        run: |
          for f in /tmp/fresh/*.gz; do cp "$f" "data/sources/$(basename "$f")"; done
          node src/validate.js
          node src/build.js | tee /tmp/build.log

      - name: open a pull request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: refresh/sources
          commit-message: 'chore: refresh upstream snapshots'
          title: 'chore: refresh upstream snapshots'
          body-path: /tmp/build.log
          labels: sources
          delete-branch: true
